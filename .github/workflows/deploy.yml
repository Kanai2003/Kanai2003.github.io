# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuild weekly (Monday 03:30 UTC) so GitHub stats on /open-source stay fresh
  schedule:
    - cron: "30 3 * * 1"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      # GitHub Pages must publish from this workflow, not "Deploy from a branch".
      # Otherwise GitHub also runs a Jekyll build of the repo on every push, and
      # whichever finishes last wins, sometimes replacing the site with README.md.
      - name: Make Pages publish from GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api repos/${{ github.repository }}/pages --jq .build_type || echo unknown)
          echo "Pages build_type: $current"
          if [ "$current" != "workflow" ]; then
            gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow
            echo "Switched Pages to GitHub Actions"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          # Raises the GitHub API rate limit for build-time stats
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and other IndexNow search engines that the pages changed,
      # so they recrawl within minutes. The key file is public/<key>.txt (public by design).
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          SITE: https://kanai2003.github.io
          INDEXNOW_KEY: a9ff2f894fd34e66a52a24c98026caa6
        run: |
          sleep 30  # give the new deployment a moment to go live
          urls=$(curl -fsS "$SITE/sitemap.xml?ts=$(date +%s)" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$urls" | jq length) URLs"
          body=$(jq -nc --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" \
            --arg loc "$SITE/$INDEXNOW_KEY.txt" --argjson urls "$urls" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow responded HTTP $code (200 or 202 means accepted)"
